; Really Simple Messenger (rsm) — a minimal, readable Meshtastic messenger for the M5Stack Cardputer ADV + Cap LoRa-1262
[platformio]
default_envs = cardputer-adv

[env:cardputer-adv]
platform = espressif32@6.10.0
board = m5stack-stamps3
framework = arduino
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = direct
; for crash backtraces use: pio device monitor -f esp32_exception_decoder
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D PB_ENABLE_MALLOC=0
  -D RADIOLIB_EXCLUDE_CC1101=1
  -D RADIOLIB_EXCLUDE_NRF24=1
  -D RADIOLIB_EXCLUDE_RF69=1
  -D RADIOLIB_EXCLUDE_SX1231=1
  -D RADIOLIB_EXCLUDE_SX1233=1
  -D RADIOLIB_EXCLUDE_SI443X=1
  -D RADIOLIB_EXCLUDE_RFM2X=1
  -D RADIOLIB_EXCLUDE_AFSK=1
  -D RADIOLIB_EXCLUDE_BELL=1
  -D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
  -D RADIOLIB_EXCLUDE_MORSE=1
  -D RADIOLIB_EXCLUDE_RTTY=1
  -D RADIOLIB_EXCLUDE_SSTV=1
  -D RADIOLIB_EXCLUDE_AX25=1
  -D RADIOLIB_EXCLUDE_APRS=1
  -D RADIOLIB_EXCLUDE_BELL=1
  -D RADIOLIB_EXCLUDE_PAGER=1
  -D RADIOLIB_EXCLUDE_FSK4=1
  -D RADIOLIB_EXCLUDE_LORAWAN=1
  -D TEST_CURVE25519_FIELD_OPS
  -Wno-missing-field-initializers
lib_ldf_mode = deep+
lib_deps =
  m5stack/M5Unified@^0.2.7
  m5stack/M5GFX@^0.2.9
  https://github.com/m5stack/M5Cardputer.git#1.1.1
  jgromes/RadioLib@^7.2.1
  rweather/Crypto@^0.4.0
  nanopb/Nanopb@^0.4.91
  mikalhart/TinyGPSPlus@^1.1.0
